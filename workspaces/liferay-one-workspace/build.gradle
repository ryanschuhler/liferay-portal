// Keep client extensions out of the baked Docker image so they deploy after
// Liferay is healthy (see scripts/deploy_client_extensions.sh). When a client
// extension is present at startup it activates during early boot; the site
// initializer in particular runs before the default site's layouts exist,
// which makes ServicePreAction build a ThemeDisplay with a null layout and
// getCanonicalURL throws an NPE, so the site is never created. Gating
// dockerDeploy on a container id skips it at image build time while still
// letting the post-health deploy push it to the running container.
subprojects {
	tasks.matching {
		it.name == "dockerDeploy"
	}.configureEach {
		onlyIf {
			System.getProperty("deploy.docker.container.id") != null
		}
	}
}

// Vite 8 (and its Rolldown bundler) requires Node ">=22.12.0 || ^20.19.0". The
// Liferay workspace's default Node is 20.12.2, and the root and client
// extension projects resolve it through different plugin application orders, so
// they can disagree and clobber the shared build/node install. Pin every
// project to the same Node 22 LTS to keep the shared install consistent and
// above Vite's floor.
allprojects {
	afterEvaluate {
		def nodeExtension = extensions.findByName("node")

		if (nodeExtension != null) {
			nodeExtension.nodeVersion = "22.23.1"
			nodeExtension.npmVersion = "10.9.8"
		}
	}
}

// `./gradlew build` must not require a running portal. The Liferay Node plugin
// auto-generates `packageRunTest` from the root package.json `test` script,
// which runs the full Playwright e2e/integration suite -- and those specs need
// a live Liferay, so `build` fails whenever the environment is down. Disable
// the task to keep `build` offline; the suite runs explicitly through
// `yarn test` (or the one-test skill) once the portal is up.
allprojects {
	tasks.matching {
		it.name == "packageRunTest"
	}.configureEach {
		enabled = false
	}
}