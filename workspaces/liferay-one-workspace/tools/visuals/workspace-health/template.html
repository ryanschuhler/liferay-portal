<title>Workspace Report</title>

<style>
/* Layout: a front desk. An overview with one card per layer and the triage queue, a workspace tab for what spans the layers, then a tab for each layer with its actions and its visuals. */
html { scrollbar-gutter: stable; }
:root {
	--wrap-width: 1760px;
	--done: var(--ok);
}
p { margin: 0; }
.muted { color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 8px 12px; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button span { font-weight: 400; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

section.panel { display: grid; gap: 20px; }
section.panel[hidden] { display: none; }
.tile.warn { box-shadow: inset 3px 0 0 var(--high); }
.tile.good { box-shadow: inset 3px 0 0 var(--done); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; align-items: start; }
.table-wrap { overflow-x: auto; }
td.text { min-width: 280px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.id { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11.5px; line-height: 19px; white-space: nowrap; border: 1px solid currentColor; }
.sev-Critical { color: var(--critical); } .sev-High { color: var(--high); } .sev-Medium { color: var(--medium); } .sev-Low { color: var(--low); }
.sev-other { color: var(--info); }
.empty { padding: 18px; color: var(--muted); text-align: center; }
.empty code { color: var(--fg); }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--font-mono); font-size: 11.5px; }
.chips span { background: var(--surface-2); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }

.specs { display: grid; gap: 10px; }
.spec { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.spec > summary { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; list-style: none; padding: 12px 14px; }
.spec > summary::-webkit-details-marker { display: none; }
.spec .name { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
.spec .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
.spec .score b { color: var(--critical); }
.refs { border-top: 1px solid var(--line); overflow-x: auto; }
.refs td.where { color: var(--muted); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; width: 1%; }
.refs td.ref { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.refs tr.missing td.ref { color: var(--critical); }

.layer-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.layer-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 8px; padding: 14px; }
.layer-card .counts { gap: 4px 16px; }
.layer-card .counts b { font-size: 20px; }
.layer-card .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
.status-dot { border-radius: 50%; display: inline-block; height: 10px; margin-right: 6px; width: 10px; }
.fresh { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.fresh b { color: var(--fg); font-weight: 600; }
.fresh .stale { color: var(--medium); }
.copy { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; padding: 2px 8px; }
.pill.new { color: var(--info); }
.untracked { color: var(--medium); font-size: 12px; }
.section-group { display: grid; gap: 20px; }
.section-nav { margin-bottom: 4px; }
.layer-actions[hidden] { display: none; }
a.src { color: var(--accent); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }

.report-eyebrow { align-items: center; display: flex; flex-wrap: wrap; gap: 6px 10px; line-height: 20px; }
.report-eyebrow .report-scope { align-items: center; display: inline-flex; flex-wrap: wrap; gap: 4px 10px; letter-spacing: 0; text-transform: none; }
.report-eyebrow .pill { line-height: 17px; }
.report-eyebrow .report-scope a { color: inherit; }
.report-eyebrow .report-scope code { color: var(--fg); font-size: 12px; }
.report-mode { border-radius: 4px; color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; line-height: 17px; padding: 0 7px; text-transform: uppercase; }
.report-mode.compare { background: var(--info); }
.report-mode.snapshot { background: var(--accent); }
.report-stats { align-items: baseline; color: var(--muted); display: flex; flex-wrap: wrap; font-size: 15px; font-variant-numeric: tabular-nums; gap: 4px 16px; margin: 0; }
.report-stats b { color: var(--fg); font-weight: 600; }
.st-done { color: var(--ok); } .st-missing { color: var(--high); } .st-check, .st-stale { color: var(--medium); } .st-none, .st-unknown { color: var(--quiet); }
.phase-card ul { margin: 0; padding-left: 18px; }
.phase-card > summary { cursor: pointer; list-style: none; }
.phase-card > summary::-webkit-details-marker { display: none; }
.files td.file { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; white-space: normal; }
.files td.num { width: 1%; }
.files td.plus { color: var(--ok); } .files td.minus { color: var(--critical); }
</style>

<!-- parts:head -->

<div class="wrap" id="page">
	<header>
		<div class="eyebrow report-eyebrow"><span aria-label="What this page shows" class="report-scope" id="scope"></span><span>· Built <span id="generated"></span></span></div>

		<h1>Workspace Report</h1>
	</header>

	<div aria-label="Sections" class="tabs" id="tabs" role="tablist"></div>

	<section class="panel" id="panel-overview" role="tabpanel"></section>
	<section class="panel" hidden id="panel-workspace" role="tabpanel">
		<div aria-label="Workspace sections" class="section-nav seg" id="ws-nav" role="group"></div>
		<div id="ws-actions"></div>
		<div class="section-group" data-section="bundle" hidden id="ws-bundle">
			<h2>Dependencies</h2>

			<div class="section-group" id="ws-dependencies"></div>

			<h2>Custom Element Build</h2>

			<div class="section-group" id="ws-bundle-build"></div>
		</div>

		<div class="section-group" data-section="tests" hidden id="ws-tests">
			<div class="section-group" id="ws-tests-runs"></div>

			<!-- parts:workspace -->

		</div>

		<div hidden id="ws-changes" style="display:grid;gap:20px"></div>
		<div hidden id="ws-specs" style="display:grid;gap:20px"></div>
	</section>

	<section class="panel" hidden id="panel-model" role="tabpanel">
		<div aria-label="Model sections" class="section-nav seg" id="nav-model" role="group"></div>
		<div class="layer-actions" id="actions-model"></div>

		<!-- parts:model -->

	</section>

	<section class="panel" hidden id="panel-view" role="tabpanel">
		<div aria-label="View sections" class="section-nav seg" id="nav-view" role="group"></div>
		<div class="layer-actions" id="actions-view"></div>

		<!-- parts:view -->

	</section>

	<section class="panel" hidden id="panel-controller" role="tabpanel">
		<div aria-label="Controller sections" class="section-nav seg" id="nav-controller" role="group"></div>
		<div class="layer-actions" id="actions-controller"></div>

		<!-- parts:controller -->

	</section>

	<footer>
		<p>Built from the workspace source by <code>tools/visuals</code>. Run <code>yarn viz:check</code> to find drift.</p>
	</footer>
</div>

<script>
const DATA = __DATA__;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const kb = n => n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(2)} MB` : `${(n / 1024).toFixed(1)} KB`;
const days = iso => iso ? Math.max(0, Math.floor((Date.parse(DATA.generated) - Date.parse(iso.slice(0, 10))) / 86400000)) : null;
// A version whose first number is a date, such as 20231013, has no major version to count.
const major = v => { const m = /^(\d+)/.exec(String(v ?? "")); return m && m[1].length < 5 ? Number(m[1]) : null; };

$("generated").textContent = DATA.generated;

// What the page shows. A point in time shows the workspace at its head. A
// comparison, built with --base, shows what the head adds to the base.
const COMPARING = DATA.mode === "diff";
const HEAD = DATA.head;
const LC = DATA.lifecycle;
const DIFF = DATA.comparison?.diff ?? null;
const n = (count, noun) => `${count} ${noun}${count === 1 ? "" : "s"}`;

function commitURL(sha) {
	const m = /^(https:\/\/github\.com\/[^/]+\/[^/]+)\//.exec(DATA.github ?? "");
	return m ? `${m[1]}/commit/${sha}` : null;
}

function refHTML(ref, sha) {
	const url = commitURL(sha);
	const short = url ? `<a href="${esc(url)}" rel="noopener" target="_blank">${sha.slice(0, 11)}</a>` : sha.slice(0, 11);
	return sha.startsWith(ref) ? `<code>${short}</code>` : `<code>${esc(ref)}</code> @ <code>${short}</code>`;
}

// The preheading names the view and its refs. A comparison's Overview starts
// with its counts.
function renderScope() {
	const working = HEAD.worktree && HEAD.uncommitted ? `<span class="pill sev-Medium">plus ${n(HEAD.uncommitted, "uncommitted file")}</span>` : "";
	if (!COMPARING) {
		$("scope").innerHTML = `<span class="report-mode snapshot">Snapshot</span>${refHTML(HEAD.ref, HEAD.sha)}${working}`;
		return;
	}
	$("scope").innerHTML = `<span class="report-mode compare">Compare</span>${refHTML(LC.base.ref, LC.base.sha)}<span>→</span>${refHTML(HEAD.ref, HEAD.sha)}${working}`;
}

function comparisonStats() {
	const lines = LC.files.reduce((sum, f) => ({added: sum.added + (f.added ?? 0), deleted: sum.deleted + (f.deleted ?? 0)}), {added: 0, deleted: 0});
	return `<div class="report-stats"><span><b>${n(LC.commits, "commit")}</b></span><span><b>${n(LC.files.length, "changed file")}</b></span><span><b style="color:var(--ok)">+${lines.added}</b> <b style="color:var(--critical)">−${lines.deleted}</b></span><span><b>${n(DIFF.added.length, "new action")}</b></span><span><b>${DIFF.resolved.length}</b> resolved</span>${LC.behind && !LC.commits ? `<span style="color:var(--medium)">The base has ${n(LC.behind, "commit")} that the head lacks, and the head adds none: the refs are probably swapped.</span>` : ""}</div>`;
}

const deps = DATA.dependencies;
const snap = deps.snapshot;

const SEVERITY_ORDER = ["critical", "high", "medium", "low", "info"];
const SEVERITY_CLASS = {critical: "sev-Critical", high: "sev-High", medium: "sev-Medium", low: "sev-Low"};
const KIND_LABEL = {problem: "Problem", defect: "Known defect", finding: "Finding"};
const LAYERS = [
	{id: "workspace", label: "Workspace"},
	{id: "model", label: "Model"},
	{id: "view", label: "View"},
	{id: "controller", label: "Controller"},
];

const keyOf = a => `${a.visual}\u0000${a.title.replace(/\d+/g, "#")}`;
const added = new Set(DIFF?.added ?? []);
const ACTIONS = DATA.actions
	.map(a => ({...a, isNew: added.has(keyOf(a))}))
	.sort((a, b) => SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity) || a.visual.localeCompare(b.visual) || a.title.localeCompare(b.title));
const open = a => a.severity !== "info";
// The triage queue: the open actions that nothing tracks, and, in a
// comparison, only the ones that the comparison adds.
const triage = ACTIONS.filter(a => open(a) && !a.tracked && (!COMPARING || a.isNew));

// Where an action came from, as a link to the tab and section that show it.
// A visual is a section of its layer's tab, and anchor and item name the
// place inside it to highlight. An action of Workspace Report itself names
// its section of the Workspace tab.
function placeLink(a) {
	if (a.visual === "workspace-health") {
		const section = a.section ?? "actions";
		const item = a.item ?? (section === "actions" ? a.title.replace(/`/g, "") : "");
		return `<a class="jump" data-item="${esc(item)}" data-tab="workspace" data-ws="${section}">Workspace · ${WS.find(([k]) => k === section)[1]}</a>`;
	}
	const place = a.visual === "rules" ? {layer: a.layer, page: "workspace-health", tab: "rules", title: `${LAYERS.find(l => l.id === a.layer)?.label ?? a.layer} · Rules`} : DATA.places[a.visual];
	if (!place) return esc(a.visual);
	return `<a class="jump" data-anchor="${esc(a.anchor ?? "")}" data-item="${esc(a.item ?? "")}" data-sub="${esc(place.layer + "-" + place.tab)}" data-tab="${esc(place.layer)}">${esc(place.title)}</a>`;
}

// A link to the code an action names, on GitHub.
function sourceLink(source) {
	if (!source) return "";
	const m = /^([\w./@-]+\.\w+)(?::(\d+))?$/.exec(source.trim());
	if (!m || !DATA.github) return `<div class="muted mono" style="margin-top:4px;overflow-wrap:anywhere">${esc(source)}</div>`;
	return `<div style="margin-top:4px"><a class="src" href="${esc(DATA.github + m[1])}${m[2] ? "#L" + m[2] : ""}" rel="noopener" target="_blank">${esc(source)}</a></div>`;
}

function markdown(list) {
	return list.map(a => [
		`- **[${a.severity}] ${a.title}**`,
		a.detail ? ` ${a.detail}` : "",
		` From: ${a.visual === "rules" ? a.layer + " rules" : DATA.places[a.visual]?.title ?? a.visual}`,
		a.source ? ` Source: ${a.source}` : "",
		` Tracked: ${a.tracked ?? "not tracked"}`,
	].filter(Boolean).join("\n")).join("\n");
}

async function copy(text, button) {
	const label = button.textContent;
	try { await navigator.clipboard.writeText(text); button.textContent = "Copied"; }
	catch { const area = document.createElement("textarea"); area.value = text; button.after(area); area.select(); button.textContent = "Selected, press copy"; setTimeout(() => area.remove(), 6000); }
	setTimeout(() => { button.textContent = label; }, 2000);
}

const filters = {};
function filterOf(layer) {
	return filters[layer] ??= {kind: new Set(["problem", "defect", "finding"]), tracked: "all", fresh: COMPARING, query: ""};
}

// The actions of a layer that the comparison resolves. The head no longer has
// them, so they show as a list above the table.
function resolvedList(layer) {
	const list = DIFF.resolved.filter(r => r.layer === layer);
	if (!list.length) return "";
	return `<details><summary>${n(list.length, "action")} resolved in this comparison</summary><div class="table-wrap"><table><tbody>${list.map(r => `<tr><td><span class="pill ${SEVERITY_CLASS[r.severity] ?? "sev-other"}">${esc(r.severity)}</span></td><td class="text" style="text-decoration:line-through;text-decoration-color:var(--muted)">${md(r.title)}</td><td class="muted">${esc(r.visual)}</td></tr>`).join("")}</tbody></table></div></details>`;
}

function actionTable(layer) {
	const f = filterOf(layer);
	const shown = ACTIONS.filter(a => a.layer === layer && f.kind.has(a.kind)
		&& (f.tracked === "all" || (f.tracked === "untracked" ? !a.tracked && open(a) : Boolean(a.tracked)))
		&& (!f.fresh || a.isNew)
		&& (!f.query || `${a.title} ${a.detail ?? ""} ${a.source ?? ""}`.toLowerCase().includes(f.query)));
	window.__shown = window.__shown || {};
	window.__shown[layer] = shown;
	return `<div class="card">
		<div class="card-head"><h3>Actions</h3>
			<div class="toolbar">
				<div aria-label="Kind" class="seg" role="group">${Object.entries(KIND_LABEL).map(([k, l]) => `<button aria-pressed="${f.kind.has(k)}" data-kind="${k}" data-layer="${layer}" type="button">${l}</button>`).join("")}</div>
				<div aria-label="Tracking" class="seg" role="group">${[["all", "All"], ["untracked", "Triage"], ["tracked", "Tracked"]].map(([k, l]) => `<button aria-pressed="${f.tracked === k}" data-tracked="${k}" data-layer="${layer}" type="button">${l}</button>`).join("")}</div>
				${COMPARING ? `<div class="seg" role="group"><button aria-pressed="${f.fresh}" data-fresh data-layer="${layer}" type="button">New in this comparison</button></div>` : ""}
				<input aria-label="Find an action" data-query data-layer="${layer}" placeholder="Find an action" type="search" value="${esc(f.query)}" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px" />

				<button class="btn" data-copy-all="${layer}" type="button">Copy ${shown.length} as Markdown</button>
			</div>
		</div>
		${COMPARING ? resolvedList(layer) : ""}
		${shown.length ? `<div class="table-wrap"><table><thead><tr><th>Severity</th><th>Action</th><th>From</th><th>Tracked</th><th></th></tr></thead><tbody>${shown.map((a, i) => `<tr>
			<td><span class="pill ${SEVERITY_CLASS[a.severity] ?? "sev-other"}">${esc(a.severity)}</span>${a.isNew ? `<br /><span class="pill new" style="margin-top:4px">new</span>` : ""}</td>
			<td class="text"><b>${md(a.title)}</b>${a.detail ? `<div class="muted" style="margin-top:4px">${md(a.detail)}</div>` : ""}${sourceLink(a.source)}<div class="muted" style="font-size:12px;margin-top:4px">${KIND_LABEL[a.kind]}</div></td>
			<td>${placeLink(a)}</td>
			<td>${a.tracked ? esc(a.tracked) : open(a) ? `<span class="untracked">not tracked</span>` : "—"}</td>
			<td><button class="copy" data-copy-one="${layer}:${i}" type="button">Copy</button></td>
		</tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nothing matches.</p>`}
	</div>`;
}

// The visuals of a layer, for the change counts on its card. The rules visual
// shows in every layer.
const visualsOfLayer = layer => Object.entries(DATA.places).filter(([visual, place]) => place.layer === layer || (visual === "rules" && layer !== "workspace")).map(([visual, place]) => ({visual, title: place.title}));

function changeSummary(layer) {
	return visualsOfLayer(layer).map(({visual, title}) => {
		if (!(visual in (DATA.changes ?? {}))) return "";
		const c = DATA.changes[visual]?.layers?.[layer] ?? DATA.changes[visual];
		if (!c) return `<div class="muted" style="font-size:12.5px">${esc(title)}: unable to compare</div>`;
		if (!c.added && !c.changed && !c.removed) return "";
		return `<div style="font-size:12.5px">${esc(title.replace(/^.* · /, ""))}${c.added ? `<span class="chg chg-added">${c.added} new</span>` : ""}${c.changed ? `<span class="chg chg-changed">${c.changed} changed</span>` : ""}${c.removed ? `<span class="chg chg-removed">${c.removed} removed</span>` : ""}</div>`;
	}).join("");
}

function renderOverview() {
	const staleDays = 7;
	const fresh = DATA.freshness.map(s => {
		const age = s.date ? days(s.date) : null;
		return `<span>${esc(s.name)}: ${age === null ? `<span class="stale">never read</span>` : `<b class="${age > staleDays ? "stale" : ""}">${age === 0 ? "today" : age + " d ago"}</b>`}${age === null || age > staleDays ? ` · <code>${esc(s.command)}</code>` : ""}</span>`;
	}).join("");
	const cards = LAYERS.map(l => {
		const list = ACTIONS.filter(a => a.layer === l.id && open(a));
		if (COMPARING) {
			const fresh = list.filter(a => a.isNew);
			const resolved = DIFF.resolved.filter(r => r.layer === l.id);
			const severe = fresh.filter(a => a.severity === "critical" || a.severity === "high").length;
			const changes = changeSummary(l.id);
			const color = severe ? "var(--critical)" : fresh.length ? "var(--medium)" : "var(--ok)";
			return `<div class="layer-card">
				<h3><span class="status-dot" style="background:${color}"></span>${l.label}</h3>

				<div class="counts"><div><b>${fresh.length}</b><span>new actions</span></div><div><b>${severe}</b><span>new critical or high</span></div><div><b>${resolved.length}</b><span>resolved</span></div></div>
				${changes ? `<div style="display:grid;gap:4px">${changes}</div>` : `<div class="muted" style="font-size:13px">No marked item changed.</div>`}
				<div class="links"><a class="jump" data-sub="${l.id === "workspace" ? "" : "actions"}" data-tab="${l.id}">Open the ${l.label.toLowerCase()} changes</a></div>
			</div>`;
		}
		const severe = list.filter(a => a.severity === "critical" || a.severity === "high").length;
		const color = list.some(a => a.kind === "problem") || severe ? "var(--critical)" : list.length ? "var(--medium)" : "var(--ok)";
		return `<div class="layer-card">
			<h3><span class="status-dot" style="background:${color}"></span>${l.label}</h3>

			<div class="counts"><div><b>${severe}</b><span>critical or high</span></div><div><b>${list.filter(a => a.severity === "medium").length}</b><span>medium</span></div><div><b>${list.filter(a => a.severity === "low").length}</b><span>low</span></div></div>
			<div class="muted" style="font-size:13px">${list.filter(a => !a.tracked).length} not tracked</div>
			<div class="links"><a class="jump" data-sub="${l.id === "workspace" ? "" : "actions"}" data-tab="${l.id}">Open the ${l.label.toLowerCase()} actions</a></div>
		</div>`;
	}).join("");
	const queue = COMPARING
		? {title: "New and Not Tracked", text: "The actions that this comparison adds and that no ticket, audit ID, or known defect tracks. Resolve or track each one before the change merges.", empty: "The comparison adds no untracked action."}
		: {title: "Triage Queue", text: "Open actions that no ticket, audit ID, or known defect tracks. File a ticket for each one, add it to known-defects.json with its ID, or fix it.", empty: "Every open action is tracked."};
	$("panel-overview").innerHTML = `
		${COMPARING ? comparisonStats() : `<div class="fresh">${fresh}</div>`}
		<div class="layer-cards">${cards}</div>
		<div class="card"><div class="card-head"><h3>${queue.title}</h3>${triage.length ? `<button class="btn" data-copy-triage type="button">Copy ${triage.length} as Markdown</button>` : ""}</div>
			<p class="muted" style="margin:0">${queue.text}</p>

			${triage.length ? `<div class="table-wrap"><table><tbody>${triage.slice(0, 15).map(a => `<tr><td><span class="pill ${SEVERITY_CLASS[a.severity] ?? "sev-other"}">${esc(a.severity)}</span></td><td class="text">${md(a.title)}</td><td>${placeLink(a)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">${queue.empty}</p>`}
			${triage.length > 15 ? `<p class="muted" style="margin:0">${triage.length - 15} more on the layer tabs, with the Triage filter.</p>` : ""}
		</div>
		${PHASES.length ? phaseDetails() : ""}`;
}

// Workspace tab: its actions, then the bundle (the dependencies and the
// custom element build), the tests with their coverage of the test plan,
// the change hotspots, and the specs.
const WS = [["actions", "Actions"], ["bundle", COMPARING ? "Dependencies" : "Bundle"], ["tests", "Tests"], ["changes", COMPARING ? "Changed Files" : "Changes"], ["specs", "Specs"]];

// A note that a section reads a snapshot of the working tree, which a
// report at a ref or a comparison cannot attribute to its refs.
const snapshotNote = what => `<p class="note">${what} come from the working tree, not from <code>${esc(HEAD.ref)}</code>.</p>`;
let ws = "actions";

// The dependencies that the comparison adds, removes, or moves to another
// version, and the known vulnerabilities of the ones it changes.
function renderDependencyDelta() {
	const delta = DATA.comparison.deltas.dependencies;
	if (!delta) {
		$("ws-dependencies").innerHTML = `<p class="note">The base has no dependency data, so the comparison cannot show what changed.</p>`;
		return;
	}
	const status = d => d.before === null ? ["added", "new"] : d.after === null ? ["removed", "removed"] : ["changed", "changed"];
	const changedNames = new Set(delta.filter(d => d.after !== null).map(d => d.name));
	const vulns = (snap?.vulnerabilities ?? []).filter(v => v.packages.some(p => changedNames.has(p.replace(/@[^@]*$/, "")) || changedNames.has(p)));
	$("ws-dependencies").innerHTML = `
		<div class="tiles">${[[delta.filter(d => d.before === null).length, "added"], [delta.filter(d => d.before !== null && d.after !== null).length, "moved to another version"], [delta.filter(d => d.after === null).length, "removed"], [vulns.length, "known vulnerabilities in the changed packages", vulns.length ? "warn" : "good"]].map(([v, l, c]) => `<div class="tile ${c ?? ""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${delta.length ? `<div class="card"><h3>Changed Dependencies</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Ecosystem</th><th>Kind</th><th>Base</th><th>Head</th></tr></thead><tbody>${delta.map(d => { const [cls, label] = status(d); return `<tr data-change="${cls}"><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(d.name)}<span class="chg chg-${cls}">${label}</span></td><td>${esc(d.ecosystem)}</td><td>${esc(d.kind)}</td><td class="id">${esc(d.before ?? "—")}</td><td class="id">${esc(d.after ?? "—")}</td></tr>`; }).join("")}</tbody></table></div></div>` : `<p class="muted">The comparison changes no dependency.</p>`}
		${vulns.length ? `<div class="card"><h3>Known Vulnerabilities in Changed Packages</h3><p class="muted">From the current snapshot of <code>yarn viz:deps</code>.</p><div class="table-wrap"><table><tbody>${vulns.map(v => `<tr><td class="id">${esc(v.id)}</td><td>${esc(v.severity ?? "unrated")}</td><td class="id">${esc(v.packages.join(", "))}</td><td>${esc(v.summary)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
}

// Dependencies, the first half of the Bundle section.
function renderDependencies() {
	if (COMPARING) { renderDependencyDelta(); return; }
	const list = deps.dependencies.map(d => {
		const latest = snap?.latest[`${d.ecosystem}:${d.name}`] ?? null;
		const current = d.version ?? (/^\D*(\d[\w.-]*)/.exec(d.declared)?.[1] ?? null);
		const behind = latest && major(current) !== null && major(latest) !== null ? major(latest) - major(current) : null;
		const newer = behind === null && latest && current && latest !== current && major(current) === null;
		return {...d, latest, behind, newer, accepted: /^latest\./.test(d.declared) && !!d.reason, floating: /^latest\./.test(d.declared) && !d.reason};
	});
	const majorsBehind = list.filter(d => d.behind > 0);
	const floating = list.filter(d => d.floating);
	const vulns = snap?.vulnerabilities ?? [];
	const sevCount = s => vulns.filter(v => (v.severity ?? "").toUpperCase() === s).length;

	const tiles = snap ? [
		[vulns.length, "known vulnerabilities in locked versions", vulns.length ? "warn" : "good"],
		[sevCount("CRITICAL") + sevCount("HIGH"), "critical or high", ""],
		[majorsBehind.length, "dependencies a major version behind", majorsBehind.length ? "warn" : "good"],
	] : [["—", "no snapshot: run yarn viz:deps", "warn"]];
	tiles.push(
		[floating.length, "Gradle dependencies on latest.release, so a build is not repeatable", floating.length ? "warn" : ""],
		[deps.duplicates.length, `packages locked at more than one version, of ${deps.locked}`, ""],
		[deps.resolutions.length, "pinned resolutions", ""],
	);
	if (deps.product) tiles.push([deps.product.behind ?? "—", `quarterly releases since ${deps.product.product}, the bundle that Gradle downloads`, deps.product.behind > 4 ? "warn" : ""]);

	const vulnRows = vulns.slice().sort((a, b) => ["CRITICAL", "HIGH", "MODERATE", "LOW"].indexOf((a.severity ?? "").toUpperCase()) - ["CRITICAL", "HIGH", "MODERATE", "LOW"].indexOf((b.severity ?? "").toUpperCase()))
		.map(v => `<tr><td class="id"><a href="https://osv.dev/vulnerability/${esc(v.id)}" style="color:var(--accent)">${esc(v.id)}</a></td><td><span class="pill ${({CRITICAL: "sev-Critical", HIGH: "sev-High", MODERATE: "sev-Medium", LOW: "sev-Low"})[(v.severity ?? "").toUpperCase()] ?? "sev-other"}">${esc(v.severity ?? "unrated")}</span></td><td class="id">${esc(v.packages.join(", "))}</td><td>${esc(v.summary)}</td></tr>`).join("");

	const depRows = list.slice().sort((a, b) => (b.behind ?? -1) - (a.behind ?? -1) || a.name.localeCompare(b.name))
		.map(d => `<tr><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(d.name)}</td><td>${esc(d.ecosystem)}</td><td>${esc(d.kind)}</td><td class="id">${esc(d.declared)}${d.version && d.version !== d.declared ? `<br /><span class="muted">locked ${esc(d.version)}</span>` : ""}</td><td class="id">${esc(d.latest ?? "—")}</td><td class="num">${d.behind > 0 ? `<span class="pill sev-${d.behind > 1 ? "High" : "Medium"}">${d.behind} major</span>` : d.floating ? `<span class="pill sev-other">floating</span>` : d.accepted ? `<span class="pill sev-other" title="${esc(d.reason)}">accepted latest.release</span>` : d.newer ? `<span class="pill sev-other">newer release</span>` : ""}</td></tr>`).join("");

	$("ws-dependencies").innerHTML = `
		<div class="tiles">${tiles.map(([n, l, c]) => `<div class="tile ${c}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${snap ? `<p class="muted">Snapshot read ${esc(snap.fetched.slice(0, 10))}, ${days(snap.fetched) ? `${days(snap.fetched)} days before this build.` : "the same day as this build."}</p>` : `<div class="card empty">No dependency snapshot. Run <code>yarn viz:deps</code>, then <code>yarn viz workspace-health</code>, to add the latest versions and the known vulnerabilities.</div>`}
		${vulns.length ? `<div class="card"><h3>Known Vulnerabilities</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Severity</th><th>Package</th><th>Summary</th></tr></thead><tbody>${vulnRows}</tbody></table></div></div>` : ""}
		<div class="two">
			<div class="card"><h3>Pinned Resolutions</h3>${deps.resolutions.length ? `<div class="table-wrap"><table><tbody>${deps.resolutions.map(r => `<tr><td class="id">${esc(r.name)}<br /><span class="muted">${esc(r.version)}</span></td><td>${md(r.reason ?? "No reason given.")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">None.</p>`}</div>
			<div class="card"><h3>Locked at More Than One Version</h3><div class="table-wrap"><table><tbody>${deps.duplicates.slice(0, 12).map(d => `<tr><td class="id">${esc(d.name)}</td><td class="id">${esc(d.versions.join(", "))}</td></tr>`).join("")}</tbody></table></div>${deps.duplicates.length > 12 ? `<p class="muted">${deps.duplicates.length - 12} more.</p>` : ""}</div>
		</div>

		<div class="card"><h3>Declared Dependencies</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Ecosystem</th><th>Kind</th><th>Declared</th><th>Latest</th><th></th></tr></thead><tbody>${depRows}</tbody></table></div></div>`;
}

// Custom element build, the second half of the Bundle section: the weight
// and the dead code of the custom element.
function renderBundle() {
	if (COMPARING) {
		$("ws-bundle-build").innerHTML = `<p class="note">The custom element build is a snapshot of the working tree, so the comparison does not show it. The actions of the build, such as the dead code and the missing translations, still compare: see Actions.</p>`;
		return;
	}
	const {build, files, languageKeys: keys} = DATA.bundle;
	const total = build ? build.files.reduce((s, f) => s + f.size, 0) : 0;
	const gzip = build ? build.files.reduce((s, f) => s + f.gzip, 0) : 0;
	const tiles = [
		[build ? kb(total) : "—", build ? `built output, ${kb(gzip)} compressed` : "no build: run yarn build in the custom element", build ? "" : "warn"],
		[files.unreachable.length, "source files that no import reaches", files.unreachable.length ? "warn" : "good"],
		[files.testOnly.length, "source files that only a test reaches", files.testOnly.length ? "warn" : ""],
		[`${files.app}/${files.sources}`, "source files, not counting tests, that the app reaches", ""],
	];
	if (keys) {
		tiles.push([keys.unused.length, `language keys of ${keys.keys} that no source file names`, ""]);
		for (const l of keys.locales) tiles.push([l.missing, `keys with no ${l.locale} translation`, l.missing ? "warn" : "good"]);
	}
	const list = items => items.length ? `<div class="chips">${items.map(i => `<span>${esc(i)}</span>`).join("")}</div>` : `<p class="muted">None.</p>`;
	$("ws-bundle-build").innerHTML = `${HEAD.worktree ? "" : snapshotNote("The built output and its size")}
		<p class="muted" style="max-width:80ch;margin:0">The weight and the dead code of <code>liferay-one-custom-element</code>: the size of the last build, the source files that no import reaches, and the language keys that no source file names or no locale translates.</p>

		<div class="tiles">${tiles.map(([n, l, c]) => `<div class="tile ${c}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${build ? `<div class="card"><div class="card-head"><h3>Built Output</h3><span class="muted">built ${esc(build.built.slice(0, 10))}</span></div><div class="table-wrap"><table><thead><tr><th>File</th><th style="text-align:right">Size</th><th style="text-align:right">Compressed</th></tr></thead><tbody>${build.files.slice(0, 15).map(f => `<tr><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(f.file)}</td><td class="num">${kb(f.size)}</td><td class="num">${kb(f.gzip)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
		<div class="two">
			<div class="card"><h3>Unreachable Source Files</h3><p class="muted">No import from <code>src/main.tsx</code> or from a test reaches these files.</p>${list(files.unreachable)}</div>
			<div class="card"><h3>Test Only Source Files</h3><p class="muted">Only a test imports these files, so the app does not use them.</p>${list(files.testOnly)}</div>
		</div>
		${keys ? `<div class="card"><div class="card-head"><h3>Language Keys No Source File Names</h3><span class="muted">${keys.unused.length} of ${keys.keys}</span></div><p class="muted">Check each key before you delete it. <code>translateLabel</code> can reach a key from a label that the server sends.</p><details><summary>Show the keys</summary>${list(keys.unused)}</details></div>` : ""}`;
}

// The changed files of a comparison, by area. A changed file that is also a
// hotspot is where the change most needs a careful review.
const AREAS = [
	[/^specs\/business\//, "Business specs"],
	[/^specs\/technical\//, "Technical specs"],
	[/^specs\//, "Other specs"],
	[/^client-extensions\/([^/]+)\//, null],
	[/^tests\//, "Tests"],
	[/^tools\//, "Tools"],
	[/^/, "Other"],
];

function renderChangedFiles() {
	const hot = new Set(DATA.hotspots.files.map(f => f.file));
	const groups = new Map();
	for (const f of LC.files) {
		const [re, label] = AREAS.find(([re]) => re.test(f.file));
		const name = label ?? re.exec(f.file)[1];
		if (!groups.has(name)) groups.set(name, []);
		groups.get(name).push(f);
	}
	const touched = LC.files.filter(f => hot.has(f.file));
	$("ws-changes").innerHTML = `
		<p class="muted" style="max-width:80ch">Every file that the comparison changes, by area, with the lines added and deleted. A file marked hotspot is one of the files that changed most in the last ${DATA.hotspots.days} days, weighted by its size.</p>

		<div class="tiles">${[[LC.files.length, "changed files"], [groups.size, "areas"], [touched.length, "hotspots touched", touched.length ? "warn" : ""]].map(([v, l, c]) => `<div class="tile ${c ?? ""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${[...groups].map(([name, files]) => `<div class="card"><div class="card-head"><h3>${esc(name)}</h3><span class="muted">${n(files.length, "file")} · +${files.reduce((sum, f) => sum + (f.added ?? 0), 0)} −${files.reduce((sum, f) => sum + (f.deleted ?? 0), 0)}</span></div>${fileTable(files, hot)}</div>`).join("") || `<p class="muted">The comparison changes no file.</p>`}`;
}

// Changes section.
function renderChanges() {
	if (COMPARING) { renderChangedFiles(); return; }
	const h = DATA.hotspots;
	$("ws-changes").innerHTML = `
		<p class="muted" style="max-width:80ch">The source files that changed most in the ${h.days} days before ${HEAD.worktree ? "this build" : `<code>${esc(HEAD.ref)}</code>`}, weighted by their size. A large file that many commits touch is where a change most often breaks something, and where a review needs the most care. Tests and language files are left out.</p>

		<div class="card"><div class="table-wrap"><table><thead><tr><th>File</th><th style="text-align:right">Commits</th><th style="text-align:right">Authors</th><th style="text-align:right">Lines</th></tr></thead><tbody>${h.files.map(f => `<tr><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(f.file.replace("client-extensions/", ""))}</td><td class="num">${f.commits}</td><td class="num">${f.authors}</td><td class="num">${f.lines}</td></tr>`).join("") || `<tr><td class="muted">No history.</td></tr>`}</tbody></table></div></div>`;
}

// The tests of a comparison: the test files it changes, and the tests it
// newly skips or focuses. The recorded runs belong to the working tree.
function renderTestChanges() {
	const markers = DATA.comparison.deltas.markers;
	const files = LC.files.filter(f => f.test);
	const code = LC.files.filter(f => f.file.startsWith("client-extensions/") && !f.test);
	$("ws-tests-runs").innerHTML = `
		<div class="tiles">${[[files.length, "changed test files", code.length && !files.length ? "warn" : ""], [markers ? markers.added.length : "—", "tests newly skipped or focused", markers?.added.length ? "warn" : ""], [markers ? markers.removed.length : "—", "tests enabled again"]].map(([v, l, c]) => `<div class="tile ${c ?? ""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${code.length && !files.length ? `<p class="note">The comparison changes code and no test.</p>` : ""}
		${files.length ? `<div class="card"><h3>Changed Test Files</h3>${fileTable(files)}</div>` : ""}
		${markers?.added.length ? `<div class="card"><h3>Newly Skipped or Focused</h3><div class="table-wrap"><table><tbody>${markers.added.map(m => `<tr><td><span class="pill ${m.kind === "only" ? "sev-High" : "sev-Low"}">${esc(m.kind)}</span></td><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(m.file)}:${m.line}</td><td class="id" style="white-space:normal">${esc(m.text)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
		${markers?.removed.length ? `<div class="card"><h3>Enabled Again</h3><div class="table-wrap"><table><tbody>${markers.removed.map(m => `<tr><td><span class="pill sev-other">${esc(m.kind)}</span></td><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(m.file)}</td><td class="id" style="white-space:normal">${esc(m.text)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
		<p class="muted">The recorded test runs belong to the working tree, so the comparison does not show them. The test plan coverage below marks what changed.</p>`;
}

// Tests section.
function renderTests() {
	if (COMPARING) { renderTestChanges(); return; }
	const t = DATA.tests;
	const count = k => t.markers.filter(m => m.kind === k).length;
	const tiles = [
		[t.files, "test files"],
		[count("only"), "focused with .only", count("only") ? "warn" : "good"],
		[count("skip"), "skipped or disabled", count("skip") ? "warn" : ""],
		[count("conditional"), "skipped only in some environments", ""],
		[t.failing.length, "failed in their latest run", t.failing.length ? "warn" : "good"],
		[t.flaky.length, "flaky in the recorded runs", t.flaky.length ? "warn" : ""],
		[t.runs.length, "recorded runs", ""],
	];
	const markers = t.markers.filter(m => m.kind !== "conditional");
	$("ws-tests-runs").innerHTML = `${HEAD.worktree ? "" : snapshotNote("The recorded test runs, the failing tests, and the flaky tests")}
		<div class="tiles">${tiles.map(([n, l, c]) => `<div class="tile ${c || ""}"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${t.runs.length ? "" : `<div class="card empty">No recorded runs. After a test run, run <code>yarn viz:tests</code> to add its JUnit results to the history, then <code>yarn viz workspace-health</code>. A flaky test shows up once the history has at least three runs of it, and it passed in the latest one after a failure.</div>`}
		${markers.length ? `<div class="card"><h3>Skipped and Focused Tests</h3><div class="table-wrap"><table><tbody>${markers.map(m => `<tr><td><span class="pill ${m.kind === "only" ? "sev-High" : "sev-Low"}">${esc(m.kind)}</span></td><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(m.file)}:${m.line}</td><td class="id" style="white-space:normal">${esc(m.text)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
		${t.failing.length ? `<div class="card"><h3>Failing Tests</h3><div class="table-wrap"><table><thead><tr><th>Test</th><th>Suite</th><th style="text-align:right">Failed</th></tr></thead><tbody>${t.failing.map(c => `<tr><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(c.id)}</td><td>${esc(c.suite)}</td><td class="num">${c.failures} of ${c.runs}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
		${t.flaky.length ? `<div class="card"><h3>Flaky Tests</h3><div class="table-wrap"><table><thead><tr><th>Test</th><th>Suite</th><th style="text-align:right">Failed</th></tr></thead><tbody>${t.flaky.map(c => `<tr><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(c.id)}</td><td>${esc(c.suite)}</td><td class="num">${c.failures} of ${c.runs}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
		${t.slowest.length ? `<div class="card"><h3>Slowest Tests</h3><div class="table-wrap"><table><thead><tr><th>Test</th><th>Suite</th><th style="text-align:right">Median</th></tr></thead><tbody>${t.slowest.map(c => `<tr><td class="id" style="white-space:normal;overflow-wrap:anywhere">${esc(c.id)}</td><td>${esc(c.suite)}</td><td class="num">${c.median.toFixed(1)} s</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
}

// The specs of a comparison: the ones it touches, and the names in backticks
// that it makes stale or fixes.
function renderSpecChanges() {
	const delta = DATA.comparison.deltas.specs;
	const touched = LC.files.filter(f => f.file.startsWith("specs/"));
	const byFile = Object.fromEntries(DATA.specs.map(spec => [spec.file, spec]));
	const row = (r, cls) => `<tr class="${cls === "removed" ? "missing" : ""}"><td class="ref">${esc(r.name)}</td><td class="where">${esc(r.file)}</td></tr>`;
	$("ws-specs").innerHTML = `
		<div class="tiles">${[[touched.length, "specs changed"], [delta ? delta.stale.length : "—", "names newly missing from the code", delta?.stale.length ? "warn" : "good"], [delta ? delta.fixed.length : "—", "names fixed"]].map(([v, l, c]) => `<div class="tile ${c ?? ""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>
		${delta?.stale.length ? `<div class="card"><h3>Newly Stale Names</h3><p class="muted">Names in backticks that the base code had and the head code does not. Update the spec, or the change broke what it describes.</p><div class="refs"><table><tbody>${delta.stale.map(r => row(r, "removed")).join("")}</tbody></table></div></div>` : ""}
		${delta?.fixed.length ? `<div class="card"><h3>Fixed Names</h3><div class="refs"><table><tbody>${delta.fixed.map(r => row(r, "")).join("")}</tbody></table></div></div>` : ""}
		${touched.length ? `<div class="card"><h3>Changed Specs</h3><div class="table-wrap"><table class="files"><tbody>${touched.map(f => { const spec = byFile[f.file]; const missing = spec ? spec.references.filter(r => !r.ok).length : 0; return `<tr><td class="file">${esc(f.file)}</td><td class="num plus">+${f.added ?? 0}</td><td class="num minus">−${f.deleted ?? 0}</td><td class="num">${spec ? (missing ? `<span class="pill sev-High">${missing} missing names</span>` : `<span class="pill" style="color:var(--ok)">every name exists</span>`) : ""}</td></tr>`; }).join("")}</tbody></table></div></div>` : `<p class="muted">The comparison changes no spec.</p>`}`;
}

// Specs section.
function renderSpecs() {
	if (COMPARING) { renderSpecChanges(); return; }
	const all = DATA.specs.flatMap(s => s.references);
	const KIND = {erc: "External reference codes", endpoint: "Endpoints", file: "Files", class: "Classes"};
	const stale = DATA.specs.filter(s => s.references.some(r => !r.ok));
	$("ws-specs").innerHTML = `
		<p class="muted" style="max-width:80ch;margin:0">Each name that a spec puts in backticks and that the code no longer has: external reference codes, sidecar endpoints and object REST paths, files, and sidecar classes. A stale spec describes old code.</p>

		<div class="tiles">${[[`${stale.length}/${DATA.specs.length}`, "stale specs"], [all.filter(r => !r.ok).length, `missing names of ${all.length}`], ...Object.entries(KIND).map(([k, l]) => [`${all.filter(r => r.kind === k && !r.ok).length}/${all.filter(r => r.kind === k).length}`, l.toLowerCase() + " missing"])].map(([n, l]) => `<div class="tile"><b>${esc(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>
		<div class="specs">${stale.map(s => `<details class="spec" open><summary><span class="name">${esc(s.file)}</span><span class="score"><b>${s.references.filter(r => !r.ok).length}</b> missing of ${s.references.length}</span></summary><div class="refs"><table><tbody>${s.references.filter(r => !r.ok).map(r => `<tr class="missing"><td class="where">line ${r.line}</td><td class="ref">${esc(r.name)}</td><td class="muted" style="width:1%;white-space:nowrap">${esc(KIND[r.kind])}</td></tr>`).join("")}</tbody></table></div></details>`).join("") || `<p class="muted">Every checked name exists in the code.</p>`}</div>`;
}

function renderWorkspace() {
	$("ws-nav").innerHTML = WS.map(([k, l]) => `<button aria-pressed="${ws === k}" data-ws="${k}" type="button">${l}</button>`).join("");
	for (const [k] of WS) $("ws-" + k).hidden = ws !== k;
	if (ws === "actions") $("ws-actions").innerHTML = actionTable("workspace");
	if (ws === "bundle") { renderDependencies(); renderBundle(); }
	if (ws === "tests") renderTests();

	// A visual inside a section, such as the test coverage under the tests,
	// shows with its section and mounts the first time the section shows.

	for (const panel of $("ws-" + ws).querySelectorAll(".layer-panel")) {
		panel.hidden = false;
		if (!mounted.has(panel.dataset.part)) {
			mounted.add(panel.dataset.part);
			mountPart(panel.dataset.part, panel);
		}
	}
	if (ws === "changes") renderChanges();
	if (ws === "specs") renderSpecs();
}

// Layer tabs: the actions of the layer, then a section for each of its
// visuals. A section mounts the first time it shows, so a diagram measures
// itself while it is visible.
const SUBS = {};
const sub = {};
const mounted = new Set();
for (const l of LAYERS) {
	if (l.id === "workspace") continue;
	SUBS[l.id] = [["actions", "Actions"], ...[...document.querySelectorAll(`#panel-${l.id} > .layer-panel`)].map(p => [p.dataset.part, p.dataset.label])];
	sub[l.id] = "actions";
}
try { Object.assign(sub, JSON.parse(localStorage.getItem("workspace-health-sections") || "{}")); } catch {}

function partPanel(id) {
	return document.querySelector(`.layer-panel[data-part="${CSS.escape(id)}"]`);
}

function renderLayer(layer) {
	if (!SUBS[layer].some(([k]) => k === sub[layer])) sub[layer] = "actions";
	const current = sub[layer];
	$("nav-" + layer).innerHTML = SUBS[layer].map(([k, l]) => `<button aria-pressed="${current === k}" data-layer="${layer}" data-sub="${k}" type="button">${esc(l)}</button>`).join("");
	$("actions-" + layer).hidden = current !== "actions";
	if (current === "actions") $("actions-" + layer).innerHTML = actionTable(layer);
	for (const panel of document.querySelectorAll(`#panel-${layer} > .layer-panel`)) panel.hidden = panel.dataset.part !== current;
	if (current !== "actions" && !mounted.has(current)) {
		mounted.add(current);
		mountPart(current, partPanel(current));
	}
}

// Opens a section and highlights the place an action names in it.
function reveal(id, anchor, item) {
	const panel = partPanel(id);
	if (!panel) return;
	const section = anchor ? panel.querySelector("#" + CSS.escape(anchor)) : null;
	if (item) vizHighlight(section ?? panel, item).then(found => { if (!found && section) vizHighlight(section, ""); });
	else if (section) vizHighlight(section, "");
}

// The lifecycle, only in a comparison: each phase of the change, the
// traditional deliverable it replaces, and the agentic artifact that shows
// it. The status of a phase comes from the diff, the mockups, the test
// report, the new and resolved actions, and the snapshots of this page.
const STATUS = {
	done: {color: "var(--ok)", label: "Done"},
	check: {color: "var(--medium)", label: "Check"},
	stale: {color: "var(--medium)", label: "Stale"},
	missing: {color: "var(--high)", label: "Missing"},
	none: {color: "var(--quiet)", label: "No change"},
	unknown: {color: "var(--quiet)", label: "Unknown"},
};

// The lifecycle shows only when the head is a feature branch, such as
// feature-LPD-12345, because only a feature has phases to follow.
const FEATURE = /(^|\/)feature-/.test(HEAD.ref);

const PHASES = !LC || !FEATURE ? [] : (() => {
	const lc = LC;
	const files = lc.files;
	const under = dir => files.filter(f => f.file.startsWith(dir));
	const business = under("specs/business/");
	const technical = under("specs/technical/");
	const code = under("client-extensions/");
	const tests = files.filter(f => f.test);
	const view = files.filter(f => f.view);
	const branchMockups = files.filter(f => f.mockup);
	const changed = files.length > 0;
	const staleSnapshots = DATA.freshness.filter(s => !s.date || days(s.date) > 7);
	const t = DATA.tests;
	const reportAge = lc.report ? days(lc.report.date) : null;
	const reportStale = lc.report && lc.changedAt && Date.parse(lc.report.date) < Date.parse(lc.changedAt);

	const WHO = "The comparison";

	return [
		{
			artifact: "mockup.html",
			deliverable: "Requirements document",
			files: branchMockups,
			id: "planning",
			label: "Planning",
			list: lc.mockups.filter(m => !branchMockups.some(f => f.file === m)),
			listLabel: "Other mockups in the workspace",
			status: branchMockups.length ? "done" : view.length ? "missing" : !changed ? "none" : "done",
			summary: branchMockups.length ? `${WHO} adds or changes ${n(branchMockups.length, "mockup")}.`
				: view.length ? `${WHO} changes ${n(view.length, "file")} of the user interface, and no mockup. Add a <code>mockup.html</code> that shows what a person sees.`
				: !changed ? `${WHO} has no changes.`
				: `${WHO} does not change the user interface, so it needs no mockup.`,
		},
		{
			artifact: "git diff specs/business",
			deliverable: "Requirements specification",
			files: business,
			id: "analysis",
			label: "Analysis",
			link: {label: "Workspace · Specs", ws: "specs"},
			status: business.length ? "done" : code.length ? "check" : "none",
			summary: business.length ? `${WHO} changes ${n(business.length, "business spec")}.`
				: code.length ? `${WHO} changes ${n(code.length, "file")} in <code>client-extensions</code>, and no business spec. Confirm that no requirement changed.`
				: `${WHO} changes no business spec.`,
		},
		{
			artifact: "git diff specs/technical",
			deliverable: "Architecture specification",
			files: technical,
			id: "design",
			label: "Design",
			link: {label: "Workspace · Specs", ws: "specs"},
			status: technical.length ? "done" : code.length ? "check" : "none",
			summary: technical.length ? `${WHO} changes ${n(technical.length, "technical spec")}.`
				: code.length ? `${WHO} changes ${n(code.length, "file")} in <code>client-extensions</code>, and no technical spec. Confirm that no object, endpoint, or integration contract changed.`
				: `${WHO} changes no technical spec.`,
		},
		{
			artifact: "git diff client-extensions",
			deliverable: "Code commits",
			files: code,
			id: "implementation",
			label: "Implementation",
			link: {label: "Workspace · Changed Files", ws: "changes"},
			status: code.length ? "done" : business.length || technical.length ? "missing" : "none",
			summary: code.length ? `${n(lc.commits, "commit")} in the comparison, and ${n(code.length, "changed file")} in <code>client-extensions</code>, ${n(code.reduce((sum, f) => sum + (f.added ?? 0), 0), "line")} added and ${code.reduce((sum, f) => sum + (f.deleted ?? 0), 0)} deleted.`
				: business.length || technical.length ? `${WHO} changes the specs, and no code yet.`
				: `${WHO} changes no client extension.`,
		},
		{
			artifact: "yarn test:report",
			deliverable: "Test reports",
			files: tests,
			id: "testing",
			label: "Testing",
			link: {label: "Workspace · Tests", ws: "tests"},
			status: !HEAD.worktree ? (code.length && !tests.length ? "check" : "unknown")
				: !lc.report ? (code.length ? "missing" : "none")
				: t.failing.length ? "check"
				: reportStale ? "stale"
				: code.length && !tests.length ? "check"
				: "done",
			summary: [
				!HEAD.worktree ? `The Playwright report and the recorded test runs belong to the working tree, so they do not describe <code>${esc(HEAD.ref)}</code>. Check out the ref and run the tests to read them.`
					: !lc.report ? "No Playwright report. Run <code>yarn test:all</code>, then <code>yarn test:report</code> to open it."
					: `The Playwright report is from ${reportAge === 0 ? "today" : reportAge + " days ago"}${reportStale ? ", before the latest change. Run the tests again" : ""}.`,
				HEAD.worktree && t.failing.length ? `${n(t.failing.length, "test")} failed in their latest recorded run.` : "",
				code.length && !tests.length ? `${WHO} changes code and no test. Add the tests in their own commit.` : tests.length ? `${WHO} changes ${n(tests.length, "test file")}.` : "",
			].filter(Boolean).join(" "),
		},
		{
			artifact: "yarn viz:diff",
			deliverable: "Release report",
			id: "deployment",
			label: "Deployment",
			status: !changed ? "none" : DIFF.added.length ? "check" : "done",
			summary: !changed ? `${WHO} has no changes.`
				: `${n(DIFF.added.length, "new action")} and ${DIFF.resolved.length} resolved.${DIFF.added.length ? ` ${triage.length} of the new actions are not tracked. Resolve or track each one before the release.` : ""}`,
		},
		{
			artifact: "yarn viz",
			deliverable: "Performance report",
			id: "maintenance",
			label: "Maintenance",
			status: staleSnapshots.length ? "stale" : triage.length ? "check" : "done",
			summary: [
				`Built ${esc(DATA.generated)}. ${ACTIONS.filter(open).length} open actions, ${triage.length} not tracked.`,
				staleSnapshots.length ? `${n(staleSnapshots.length, "snapshot")} ${staleSnapshots.length === 1 ? "is" : "are"} older than 7 days or never read: ${staleSnapshots.map(s => `<code>${esc(s.command)}</code>`).join(", ")}.` : "Every snapshot is current.",
			].join(" "),
		},
	];
})();

function fileTable(files, hot = new Set()) {
	if (!files?.length) return "";
	return `<div class="table-wrap"><table class="files"><tbody>${files.slice(0, 40).map(f => `<tr><td class="file">${esc(f.file)}${f.untracked ? ` <span class="pill sev-other">untracked</span>` : ""}${hot.has(f.file) ? ` <span class="pill sev-Medium">hotspot</span>` : ""}</td><td class="num plus">${f.added === null ? "binary" : "+" + f.added}</td><td class="num minus">${f.deleted === null ? "" : "−" + f.deleted}</td></tr>`).join("")}</tbody></table></div>${files.length > 40 ? `<p class="muted">${files.length - 40} more.</p>` : ""}`;
}

function phaseLink(link) {
	if (!link) return "";
	return link.ws ? `<a class="jump" data-tab="workspace" data-ws="${link.ws}" href="#">${esc(link.label)}</a>` : `<a class="jump" data-tab="${link.tab}" href="#">${esc(link.label)}</a>`;
}

// The lifecycle of a comparison of a feature branch, at the end of its
// Overview: the details of each phase, with its artifact, its status, and its changed files.
function phaseDetails() {
	return `<h2>Lifecycle</h2>
		${PHASES.map(p => `<details class="card phase-card" id="phase-${p.id}">
			<summary class="card-head"><h3><span class="status-dot" style="background:${STATUS[p.status].color}"></span>${esc(p.label)} · <code>${esc(p.artifact)}</code></h3><span class="pill st-${p.status}">${esc(STATUS[p.status].label)}</span></summary>

			<p>${p.summary}</p>
			${fileTable(p.files)}
			${p.list?.length ? `<details><summary>${esc(p.listLabel)} (${p.list.length})</summary><div class="chips" style="margin-top:6px">${p.list.map(m => `<span>${esc(m)}</span>`).join("")}</div></details>` : ""}
			${phaseLink(p.link)}
		</details>`).join("")}`;
}

// Tabs. In a comparison, Overview counts the phases that need attention,
// and a layer tab counts its new actions. In a snapshot, a layer tab counts
// its open actions. Each mode remembers its own tab.
const TABS = [
	{id: "overview", label: "Overview", n: PHASES.length ? PHASES.filter(p => p.status === "missing" || p.status === "stale" || p.status === "check").length : null},
	...LAYERS.map(l => ({id: l.id, label: l.label, n: ACTIONS.filter(a => a.layer === l.id && open(a) && (!COMPARING || a.isNew)).length})),
];
const TAB_KEY = `workspace-health-tab-${DATA.mode}`;
let tab = TABS[0].id;
try { tab = localStorage.getItem(TAB_KEY) || tab; } catch {}
if (!TABS.some(t => t.id === tab)) tab = TABS[0].id;

function render() {
	$("tabs").innerHTML = TABS.map(t => `<button aria-selected="${t.id === tab}" data-tab="${t.id}" role="tab" type="button">${t.label}${t.n !== null ? `<span>${t.n}</span>` : ""}</button>`).join("");
	for (const t of TABS) $("panel-" + t.id).hidden = t.id !== tab;
	if (tab !== "overview" && tab !== "workspace") renderLayer(tab);
	if (tab === "overview") renderOverview();
	else if (tab === "workspace") renderWorkspace();
}

// A section handles its own clicks and input.
document.addEventListener("click", ev => {
	if (ev.target.closest(".layer-panel")) return;
	const t = ev.target.closest("[data-tab],[data-ws],[data-sub],[data-kind],[data-tracked],[data-fresh],[data-copy-all],[data-copy-one],[data-copy-triage]");
	if (!t) return;
	if (t.dataset.copyAll) { copy(markdown(window.__shown[t.dataset.copyAll] ?? []), t); return; }
	if (t.dataset.copyOne) { const [layer, i] = t.dataset.copyOne.split(":"); copy(markdown([window.__shown[layer][Number(i)]]), t); return; }
	if (t.dataset.copyTriage !== undefined) { copy(markdown(triage), t); return; }
	ev.preventDefault();
	if (t.dataset.tab) { tab = t.dataset.tab; if (t.dataset.ws) ws = t.dataset.ws; if (t.dataset.sub && sub[tab]) sub[tab] = t.dataset.sub; if (t.dataset.sub && tab === "workspace") ws = partPanel(t.dataset.sub)?.closest("[data-section]")?.dataset.section ?? ws; try { localStorage.setItem(TAB_KEY, tab); } catch {} }
	else if (t.dataset.ws) ws = t.dataset.ws;
	else if (t.dataset.sub) sub[t.dataset.layer] = t.dataset.sub;
	else {
		const f = filterOf(t.dataset.layer);
		if (t.dataset.kind) f.kind.has(t.dataset.kind) ? f.kind.delete(t.dataset.kind) : f.kind.add(t.dataset.kind);
		if (t.dataset.tracked) f.tracked = t.dataset.tracked;
		if (t.dataset.fresh !== undefined) f.fresh = !f.fresh;
	}
	try { localStorage.setItem("workspace-health-sections", JSON.stringify(sub)); } catch {}
	render();
	if (t.dataset.tab && sub[tab] && sub[tab] !== "actions") reveal(sub[tab], t.dataset.anchor, t.dataset.item);
	else if (tab === "workspace" && t.dataset.sub && partPanel(t.dataset.sub)) reveal(t.dataset.sub, t.dataset.anchor, t.dataset.item);
	else if (t.dataset.item && t.dataset.ws) vizHighlight($("ws-" + ws), t.dataset.item);
});
document.addEventListener("input", ev => {
	if (ev.target.closest(".layer-panel")) return;
	const t = ev.target.closest("[data-query]");
	if (!t) return;
	filterOf(t.dataset.layer).query = t.value.trim().toLowerCase();
	render();
	const input = document.querySelector(`[data-query][data-layer="${t.dataset.layer}"]`);
	if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
});

renderScope();
render();
</script>
